<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EventFlow - Dashboard</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <h1>EventFlow</h1>
    <p>Plan your event. Manage every task.</p>
  </header>

  <!-- Event Details -->
  <main class="container">
    <section class="event-dashboard">
      <h2 id="dashboardEventName"> Event Name </h2>
      <p id="dashboardEventType"> Event Type </p>
      <p id="dashboardEventDate"> Event Date </p>
      <p id="dashboardEventLocation"> Location </p>

      <!-- new task button -->
      <div class="dashboard-actions">
        <button class="primary-button" id="addTaskButton"> Add New Task </button>
      </div>
    </section>

  </main>

  <script src="../js/script.js"></script>

</body>

</html>
