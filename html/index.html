<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFlow - Event Planner</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div>
      <h1>🎉 EventFlow</h1>
      <p>Plan your event. Manage every task.</p>
    </div>
  </header>

  <!-- Event Form -->
  <main class="container">
    <section class="event-form-section">

      <h2>Create New Event</h2>
      <form id="eventForm">
        <div class="form-group">
          <label for="eventName"> Event Name </label>
          <input type="text" id="eventName" name="eventName" placeholder="Enter event name">
        </div>

        <div class="form-group">
          <label for="eventType"> Event Type </label>
          <select id="eventType" name="eventType">
            <option value=""> Select event type</option>
            <option value="birthday"> Birthday </option>
            <option value="wedding"> Wedding </option>
            <option value="corporate"> Corporate </option>
            <option value="party"> Party </option>
            <option value="meetup"> Meetup </option>
            <option value="other"> Other </option>
          </select>
        </div>

        <div class="form-group">
          <label for="eventDate"> Event Date</label>
          <input type="date" id="eventDate" name="eventDate">
        </div>

        <div class="form-group">
          <label for="eventLocation"> Location </label>
          <input type="text" id="eventLocation" name="eventLocation" placeholder="Enter event location">
        </div>

        <!-- Error -->
        <p id="eventError" class="error-message"></p>

        <!-- Submit -->
        <button type="submit" class="primary-button"> Create Event </button>
      </form>

    </section>
  </main>

  <script src="../js/script.js"></script>

</body>

</html>
